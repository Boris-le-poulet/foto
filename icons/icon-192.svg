<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="38" fill="#0d0d0d"/>
  <!-- Aperture blades -->
  <g transform="translate(96,96)">
    <!-- Outer ring -->
    <circle r="72" fill="none" stroke="#333" stroke-width="4"/>
    <circle r="52" fill="none" stroke="#555" stroke-width="2"/>
    <!-- 6 aperture blades -->
    <g id="blade">
      <ellipse cx="0" cy="-38" rx="18" ry="32" fill="#1a9eff" opacity="0.85"/>
    </g>
    <use href="#blade" transform="rotate(60)"/>
    <use href="#blade" transform="rotate(120)"/>
    <use href="#blade" transform="rotate(180)"/>
    <use href="#blade" transform="rotate(240)"/>
    <use href="#blade" transform="rotate(300)"/>
    <!-- Center lens -->
    <circle r="16" fill="#0d0d0d" stroke="#1a9eff" stroke-width="2"/>
    <circle r="6" fill="#1a9eff" opacity="0.6"/>
  </g>
</svg>
